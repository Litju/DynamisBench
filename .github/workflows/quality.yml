# ADR-025: portable software qualification is authoritative on ephemeral
# GitHub-hosted runners. Windows x64 and Linux x64 are distinct qualification
# targets, each on an explicit stable image, and each resolves its own platform
# environment. ADR-024 (universal self-hosted runners) is superseded; no gate in
# this file routes to `self-hosted` and there is no hosted fallback.
#
# These runners are ephemeral and isolated, so pull-request code — including code
# from a public fork — may execute here. The price of that is honoured: the token
# is read-only, no secret is referenced, and `pull_request_target` is deliberately
# not used anywhere (it would check out untrusted head code with a privileged
# token).
#
# The image labels are pinned explicitly rather than through `-latest`, so a
# qualification result is interpretable against a named runner image.
name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; no build or test job needs write, package, or id-token scope.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Records the runner image and resolved toolchain identity the rest of this
  # workflow is qualified against (ADR-025, ADR-009). The record is an artifact,
  # never runner-local authority, and it is deliberately free of the WSL/uname
  # sniffing that only ever distinguished the old self-hosted Linux target: the
  # Linux job here is a real Linux VM.
  platform-identity:
    name: platform-identity (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-2025
          - name: linux-x64
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # uv reads `python/.python-version` itself and installs that interpreter; naming a
      # version here as well would only create a second source to drift from the declaration.
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # The same locked environment the qualification jobs build, so the interpreter recorded
      # below is the interpreter they will run rather than one inferred from a declaration.
      - name: Resolve the qualified Python environment
        working-directory: python
        run: uv sync --frozen
      - name: Record runner image and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          tool_version() {
            local resolved
            resolved="$("$@" --version 2>&1 | head -n 1 || true)"
            printf '%s' "${resolved:-absent}"
          }
          # The interpreter of the environment the qualification jobs actually run in,
          # built from the same locked `uv sync` they use - not the one the image happens to
          # put on PATH. Both images ship a 3.12 of their own, and recording that as the
          # qualified toolchain would report a difference between the platforms that is not there.
          declared_python="$(tr -d '[:space:]' < python/.python-version)"
          qualified_python="$(cd python && uv run --frozen python -c 'import sys; print(sys.executable)')"
          qualified_version="$("$qualified_python" -c 'import platform; print(platform.python_version())')"
          if [ "$qualified_version" != "$declared_python" ]; then
            printf '::error::the qualified interpreter is %s but python/.python-version declares %s\n' \
              "$qualified_version" "$declared_python" >&2
            exit 1
          fi
          mkdir -p evidence
          {
            printf '{\n'
            printf '  "authority": "ADR-025",\n'
            printf '  "authoritative": true,\n'
            printf '  "target": "%s",\n'          "${{ matrix.name }}"
            printf '  "image_os": "%s",\n'       "${ImageOS:-absent}"
            printf '  "image_version": "%s",\n' "${ImageVersion:-absent}"
            printf '  "runner_os": "%s",\n'      "${RUNNER_OS}"
            printf '  "runner_arch": "%s",\n'    "${RUNNER_ARCH}"
            printf '  "repository": "%s",\n'     "${GITHUB_REPOSITORY}"
            printf '  "ref": "%s",\n'            "${GITHUB_REF}"
            printf '  "github_sha": "%s",\n'     "${GITHUB_SHA}"
            printf '  "declared_python": "%s",\n' "$declared_python"
            printf '  "python": "%s",\n'         "$(tool_version "$qualified_python")"
            printf '  "uv": "%s",\n'             "$(tool_version uv)"
            printf '  "node": "%s",\n'           "$(tool_version node)"
            printf '  "pnpm": "%s",\n'           "$(tool_version pnpm)"
            printf '  "rustc": "%s",\n'          "$(tool_version rustc)"
            printf '  "cargo": "%s"\n'           "$(tool_version cargo)"
            printf '}\n'
          } > evidence/platform-identity.json
          cat evidence/platform-identity.json
          {
            echo "### Hosted qualification identity"
            echo
            echo '```json'
            cat evidence/platform-identity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-identity-${{ matrix.name }}
          path: evidence/platform-identity.json
          if-no-files-found: error
          retention-days: 90

  python:
    name: python (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-2025
          - name: linux-x64
            runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Each job resolves its own platform environment; no .venv, node_modules,
      # Cargo target, or simulator environment is shared across OSes (ADR-023).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Record resolved Python toolchain
        run: |
          {
            echo "python: $(uv run python --version)"
            echo "uv: $(uv --version)"
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown} ${RUNNER_OS}/${RUNNER_ARCH}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Format check (Ruff)
        run: uv run ruff format --check .
      - name: Type check (Pyright)
        run: uv run pyright
      - name: Test (pytest + Hypothesis)
        run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci

  frontend:
    name: frontend (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-2025
          - name: linux-x64
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record resolved frontend toolchain
        run: |
          {
            echo "node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown} ${RUNNER_OS}/${RUNNER_ARCH}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Type check (tsc)
        run: pnpm run typecheck
      - name: Test (Vitest)
        run: pnpm run test
      - name: Build (Vite)
        run: pnpm run build

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-2025
          - name: linux-x64
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record resolved desktop toolchain
        run: |
          {
            echo "node: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown} ${RUNNER_OS}/${RUNNER_ARCH}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the workbench (Tauri frontendDist)
        run: pnpm run build
      - name: Build the Tauri desktop shell
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml