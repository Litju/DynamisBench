[project]
name = "dynamisbench"
version = "0.0.0"
description = "DynamisBench — scientific core, execution boundaries, and local application API."
requires-python = ">=3.12,<3.13"
# Pydantic v2 is the validated semantic representation of the domain model (DB-1.2).
# rfc8785 is the RFC 8785 / JCS canonical serialiser the semantic identity of every
# validated definition is hashed over (DB-1.3). Together they are the entire
# dependency surface of the scientific core: it stays engine-independent and free of
# numerical/IO infrastructure.
#
# pyyaml is a runtime dependency because DB-2.4 (RES-377) reads YAML authority at
# runtime, not only under test: workspace source discovery accepts JSON and YAML
# documents, and the domain's own authority is authored in both. It is a serialiser
# and nothing more - no templating, no code execution - and the workspace loader
# uses yaml.safe_load-shaped loading throughout.
#
# fastapi and uvicorn are the application API boundary only (DB-2.1, ADR-016). FastAPI
# is imported by `dynamisbench.api` and by nothing else in this package. Uvicorn is
# declared but deliberately never imported here: a server process is the desktop
# session's concern (ADR-017, RES-375), so importing this package cannot start one.
# The plain `fastapi` distribution is used rather than `fastapi[standard]`, which
# would drag in unrelated CLI tooling this project does not use.
dependencies = [
    "fastapi>=0.121.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "uvicorn>=0.40.0",
]

[project.scripts]
dbench = "dynamisbench.cli:main"

[dependency-groups]
# httpx2 is the synchronous ASGI client Starlette's in-process `TestClient` is built on,
# and is the client it now requires rather than the deprecated `httpx` package. DB-2.1
# exercises the API entirely in process, so a listening socket is never opened; this is
# a development dependency and never a runtime one.
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["dynamisbench"]

[tool.pyright]
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
